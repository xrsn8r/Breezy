name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0" "ndk;$NDK_VERSION" > /dev/null

      - name: Rust toolchain (arm64 Android)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/Cargo.lock') }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BREEZY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BREEZY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::BREEZY_KEYSTORE_BASE64 secret not set - APK will be signed with a throwaway debug key"
          fi

      - name: Build arm64-v8a release APK
        env:
          BREEZY_KEYSTORE_PASSWORD: ${{ secrets.BREEZY_KEYSTORE_PASSWORD }}
          BREEZY_KEY_ALIAS: ${{ secrets.BREEZY_KEY_ALIAS }}
          BREEZY_KEY_PASSWORD: ${{ secrets.BREEZY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PbreezyAbis=arm64-v8a -PrefreshFilterLists=true --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Breezy-${TAG}-arm64-v8a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Breezy ${{ env.TAG }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            Fast Android WebView browser with Brave's adblock-rust engine built in and a Material 3 Expressive UI.

            **Download:** `Breezy-${{ env.TAG }}-arm64-v8a.apk` (64-bit ARM, Android 8.0+)

            ### Highlights
            - Network ad/tracker blocking via Brave's adblock-rust (Rust, JNI) on every subresource request
            - Cosmetic filtering + uBO scriptlets injected at document start
            - Filter engine precompiled at build time (EasyList, EasyPrivacy, uBlock filters & privacy, Brave unbreak) for instant startup; refreshable in-app
            - Material 3 Expressive UI: floating toolbar, wavy progress, shape-morphing shields panel, dynamic color
            - Tabs, downloads, file upload, fullscreen video, desktop mode

            ### arm64-v8a build
            - Single-ABI APK, native code built with fat LTO / codegen-units=1 / opt-level 3
            - 16 KB page-aligned native library (Android 15+ ready), stored uncompressed and mmapped directly
            - Engine loaded natively from disk (no Java-heap copy)
