name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the "changes since last release" fallback

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0" "ndk;$NDK_VERSION" > /dev/null

      - name: Rust toolchain (arm64 Android)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ hashFiles('rust/Cargo.lock') }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BREEZY_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BREEZY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BREEZY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BREEZY_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing BREEZY_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing BREEZY_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing BREEZY_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing BREEZY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Missing signing secrets:$missing - APK will be signed with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore could not be opened with BREEZY_KEYSTORE_PASSWORD / BREEZY_KEY_ALIAS - check the secrets"
            exit 1
          fi
          echo "BREEZY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Release signing key loaded (alias $KEY_ALIAS)"

      - name: Build arm64-v8a release APK
        env:
          BREEZY_KEYSTORE_PASSWORD: ${{ secrets.BREEZY_KEYSTORE_PASSWORD }}
          BREEZY_KEY_ALIAS: ${{ secrets.BREEZY_KEY_ALIAS }}
          BREEZY_KEY_PASSWORD: ${{ secrets.BREEZY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PbreezyAbis=arm64-v8a -PrefreshFilterLists=true --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Breezy-${TAG}-arm64-v8a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Release notes
        run: |
          VERSION="${TAG#v}"
          # This version's section of CHANGELOG.md ("## 0.8.1" up to the next "## ").
          awk -v v="$VERSION" '
            $0 ~ "^## v?" v "([[:space:]]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/changes.md || true
          if ! grep -q '[^[:space:]]' dist/changes.md; then
            # No hand-written notes: list commits since the previous release tag.
            PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
            RANGE=${PREV:+$PREV..HEAD}
            git log --no-merges --pretty='- %s' ${RANGE:-HEAD~20..HEAD} > dist/changes.md
          fi
          {
            echo "## What's new"
            echo
            cat dist/changes.md
            echo
            echo "**Download:** \`Breezy-${TAG}-arm64-v8a.apk\` (64-bit ARM, Android 8.0+). Already on 0.8.0 or later? Breezy offers this update itself."
            echo
            echo "<details><summary>About Breezy</summary>"
            echo
            echo "Fast Android WebView browser with Brave's adblock-rust engine built in and a Material 3 Expressive UI. Ad and tracker blocking on every request, uBO scriptlets, multi-connection downloads, DNS over HTTPS, private tabs and reader mode."
            echo
            echo "</details>"
          } > dist/notes.md
          cat dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Breezy ${{ env.TAG }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body_path: dist/notes.md
