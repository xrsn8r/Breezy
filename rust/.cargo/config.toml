# arm64 tuning. We stay on the baseline ARMv8.0-A ISA (+neon is the target default) so
# Cortex-A53-class devices keep working. (`+outline-atomics` is deliberately not set: rustc
# reports it as unstable and slated to become a hard error.)
[target.aarch64-linux-android]
rustflags = [
    # Required for Android 15+ 16 KB page-size devices (NDK r28 already defaults to this).
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]
